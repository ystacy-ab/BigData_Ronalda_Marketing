# Databricks Asset Bundle: deploys the pipeline as one Job.
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run tpch_marketing_pipeline -t dev
bundle:
  name: tpch_marketing_lakehouse

variables:
  catalog:
    description: Unity Catalog catalog the team can write to
    default: workspace
  env:
    description: Environment prefix for schema names
    default: dev
  source:
    description: Source schema with TPC-H
    default: samples.tpch

targets:
  dev:
    mode: development
    default: true
    variables:
      env: dev
  preprod:
    variables:
      env: preprod

resources:
  jobs:
    tpch_marketing_pipeline:
      name: tpch_marketing_pipeline_${var.env}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: env
          default: ${var.env}
        - name: source
          default: ${var.source}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
        - task_key: validation
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ./notebooks/04_validation.py
        - task_key: monitoring
          depends_on: [{ task_key: validation }]
          notebook_task:
            notebook_path: ./notebooks/06_monitoring.py
